services:
  db:
    # The original site's database is MariaDB (confirmed by the AI1WM dump
    # header: "Class: Ai1wm_Database_Mariadb"), which is why some collations
    # in the dump (e.g. utf8mb3_uca1400_ai_ci) aren't recognized by MySQL 8.
    # IMPORTANT: db_data holds the real catalog. NEVER run `docker compose down -v`.
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: catalog
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      API_KEY: ${CATALOG_API_KEY}
      PUBLIC_URL: http://localhost:8080
    volumes:
      - ./api:/var/www
    ports:
      - "8080:80"

volumes:
  db_data:
  wp_core:
