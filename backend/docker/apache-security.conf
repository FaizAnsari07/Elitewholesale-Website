ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Uploaded files are data only: never execute anything from here.
<Directory /var/www/public/uploads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    <FilesMatch "\.(php|phtml|phar|pl|py|cgi)$">
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
